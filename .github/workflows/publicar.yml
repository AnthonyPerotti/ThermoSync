name: Publicar

# A cada push na main, gera o ThermoSync.exe e atualiza a release "latest".
# Ao criar uma tag (ex.: v1.0.0), gera tambem uma release fixa dessa versao.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (arquivo unico, com o .NET embutido)
        run: dotnet publish ThermoSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Compress-Archive -Path dist/ThermoSync.exe, dist/LEIA-ME.txt -DestinationPath ThermoSync.zip

      - name: Sincronizar tag latest
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest $env:GITHUB_SHA
          git push -f origin latest

      - name: Publicar Release (Branch main -> latest)
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (gh release view latest 2>$null) {
            gh release edit latest --title "THERMOSYNC (versao mais recente)" --notes-file CHANGELOG.md
            gh release upload latest dist/ThermoSync.exe ThermoSync.zip --clobber
          } else {
            gh release create latest dist/ThermoSync.exe ThermoSync.zip --title "THERMOSYNC (versao mais recente)" --notes-file CHANGELOG.md
          }

      - name: Publicar Release (Tag de Versao)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (gh release view $tag 2>$null) {
            Write-Host "::warning::Release $tag ja existe. Nenhuma alteracao feita."
          } else {
            gh release create $tag dist/ThermoSync.exe ThermoSync.zip --title "THERMOSYNC $tag" --notes-file CHANGELOG.md --verify-tag
          }
