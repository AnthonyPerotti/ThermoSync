name: Publicar

# A cada push na main, gera o ThermoSync.exe e atualiza a release "latest".
# Ao criar uma tag (ex.: v1.0.0), gera tambem uma release fixa dessa versao.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (arquivo unico, com o .NET embutido)
        run: dotnet publish ThermoSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Compress-Archive -Path dist/ThermoSync.exe, dist/LEIA-ME.txt -DestinationPath ThermoSync.zip

      - name: Sincronizar tag latest
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest $env:GITHUB_SHA
          git push -f origin latest

      - name: Publicar Release (Branch main -> latest)
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "THERMOSYNC (versao mais recente)"
          body_path: CHANGELOG.md
          prerelease: false
          draft: false
          make_latest: true
          files: |
            ThermoSync.zip
            dist/ThermoSync.exe

      - name: Publicar Release (Tag de Versao)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "THERMOSYNC ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          prerelease: false
          draft: false
          make_latest: false
          files: |
            ThermoSync.zip
            dist/ThermoSync.exe
